# PROPOSED v2 workflow (preregistration v2, changes 8 and 10). Nothing below has run. The bot that
# wrote this cannot push to .github/workflows, so install it yourself, in a PR you review:
#
#   cp docs/live-eval-v2.workflow.yml .github/workflows/live-eval-v2.yml
#
# Keep the file name live-eval-v2.yml: the prior-run lookup below queries that workflow by name.
# Repository secrets (Settings > Secrets and variables > Actions), one per provider, created by
# the owner: XAI_API_KEY (M1), TOGETHER_API_KEY (M4) for stage 1; ANTHROPIC_API_KEY (M2) and
# GEMINI_API_KEY (M3) for stage 2. A run exposes ONLY the key of the model it runs, and none on a
# dry run. Gemini stays refused by the driver until its client is built and confirmed.
#
# Manual only (workflow_dispatch). Never on push, pull_request or schedule. Live runs also need
# docs/PREREGISTRATION-v2-multimodel.md to read "**Status: FROZEN <date>**" (a reviewed PR).
#
# Spend ledger. The committed runs/spend_ledger_v2.jsonl is the SOURCE OF TRUTH ($260 ceiling,
# per-model caps in tripwire/live_v2.py). Each shard appends to its own copy; the merge job joins
# them (python -m tripwire.live_v2 merge) and uploads live-v2-paid-<run id> holding the merged
# spend_ledger_v2.jsonl. Commit that file in a PR BEFORE the next run. Enforced before any spend:
#   1. the last completed PAID v2 run's merged ledger must already be in the committed file;
#   2. ledger_rows must equal the spend rows in the committed file;
#   3. budget_usd is PER SHARD and may not exceed an equal share of the room left in both the
#      ceiling and the model's cap, so shards running at the same time cannot pass either.
#
# Order (owner decision, staged): stage 1 = M4 pilot (arm pilot, gpt-oss-120b), then M1 scored and
# M4 scored (pilot_run = the M4 pilot's run id). Stage 2 = M2 and M3 pilots, then their scored
# runs, before 2026-12-31. The bridge (arm bridge) is M1 only, 24 gate runs.
#
# Shards: about 61 s per run, 960 runs per scored row, so use shards 6 (about 2.7 h each, under
# GitHub's 6-hour job limit). A shard that stops early (BUDGET_HALT, QUOTA_HALT, RUN_ERROR) is
# resumed by re-dispatching the same inputs with resume_run = this run's id: each shard's out/
# directory is fetched back and the runner skips every job already in its receipt.
name: live-eval-v2
on:
  workflow_dispatch:
    inputs:
      model:
        description: "v2 model row"
        type: choice
        options: [grok-4.7, gpt-oss-120b, claude-sonnet-5-5, gemini-3.8-flash]
      stage:
        description: "1 = grok-4.7 + gpt-oss-120b; 2 = claude-sonnet-5-5 + gemini-3.8-flash"
        type: choice
        options: ["1", "2"]
      arm:
        description: "scored (960 runs), pilot (20, M2-M4), bridge (24 gate runs, M1 only)"
        type: choice
        options: [scored, pilot, bridge]
        default: pilot
      shards:
        description: "Parallel shards (scored only; pilot and bridge use 1)"
        type: choice
        options: ["1", "4", "6", "8"]
        default: "1"
      budget_usd:
        description: "Cap PER SHARD in USD; at most the shard's share of the room left"
        type: string
        required: true
      ledger_rows:
        description: "Spend rows in the committed runs/spend_ledger_v2.jsonl (count N, not the header)"
        type: string
        required: true
      pilot_run:
        description: "M2-M4 scored only: run id of that model's pilot (live-v2-paid-<id>)"
        type: string
        default: ""
      resume_run:
        description: "Run id whose shard directories to fetch and resume (same inputs); blank = fresh"
        type: string
        default: ""
      confirm:
        description: "Type I-APPROVE-LIVE-SPEND to spend money"
        type: string
        required: true
      dry_run:
        description: "Scripted client, no secret, no spend (leave ticked until you mean it)"
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: live-eval-v2
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        env:
          SHARDS: ${{ inputs.shards }}
          ARM: ${{ inputs.arm }}
        run: |
          set -euo pipefail
          if [ "$ARM" != "scored" ] && [ "$SHARDS" != "1" ]; then
            echo "REFUSED: only the scored arm is sharded" >&2; exit 1
          fi
          echo "shards=$(python3 -c "import json,os; print(json.dumps(list(range(1, int(os.environ['SHARDS']) + 1))))")" >> "$GITHUB_OUTPUT"
  prior:
    runs-on: ubuntu-latest
    steps:
      - name: Find and fetch the last paid v2 run's merged ledger (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p prior
          ids=$(gh api --paginate \
            "repos/$REPO/actions/workflows/live-eval-v2.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[].id')
          found=""
          for id in $ids; do
            row=$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("live-v2-paid-")) | "\(.name) \(.expired)"')
            if [ -n "$row" ]; then found="$id $row"; break; fi
          done
          if [ -z "$found" ]; then
            echo "none" > prior/flag
          else
            set -- $found
            if [ "$3" != "false" ]; then
              echo "REFUSED: the last paid v2 run's artifact expired; verify the committed ledger" >&2
              exit 1
            fi
            gh run download "$1" --repo "$REPO" --name "$2" --dir prior/run
            test -f prior/run/spend_ledger_v2.jsonl
            echo "ledger" > prior/flag
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (verify the pin)
        with: { name: "prior-${{ github.run_id }}", path: prior/, retention-days: 1 }
  run:
    needs: [plan, prior]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verify the pin)
        with: { name: "prior-${{ github.run_id }}", path: prior }
      - name: Fetch the pilot and the shard to resume (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PILOT_RUN: ${{ inputs.pilot_run }}
          RESUME_RUN: ${{ inputs.resume_run }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p shard
          for id in "$PILOT_RUN" "$RESUME_RUN"; do
            case "$id" in *[!0-9]*) echo "REFUSED: run ids are digits" >&2; exit 1;; esac
          done
          if [ -n "$PILOT_RUN" ]; then
            gh run download "$PILOT_RUN" --repo "$REPO" --name "live-v2-paid-$PILOT_RUN" --dir pilot
            test -f pilot/shard-1/out/receipt.jsonl
          fi
          if [ -n "$RESUME_RUN" ]; then
            gh run download "$RESUME_RUN" --repo "$REPO" --name "live-v2-paid-$RESUME_RUN" --dir resume
            if [ -d "resume/shard-$SHARD/out" ]; then cp -r "resume/shard-$SHARD/out" shard/out; fi
          fi
      - name: Run one shard (only this model's key is visible, and only to a live run)
        env:
          XAI_API_KEY: ${{ !inputs.dry_run && inputs.model == 'grok-4.7' && secrets.XAI_API_KEY || '' }}
          TOGETHER_API_KEY: ${{ !inputs.dry_run && inputs.model == 'gpt-oss-120b' && secrets.TOGETHER_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ !inputs.dry_run && inputs.model == 'claude-sonnet-5-5' && secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ !inputs.dry_run && inputs.model == 'gemini-3.8-flash' && secrets.GEMINI_API_KEY || '' }}
          MODEL: ${{ inputs.model }}
          STAGE: ${{ inputs.stage }}
          ARM: ${{ inputs.arm }}
          SHARDS: ${{ inputs.shards }}
          SHARD: ${{ matrix.shard }}
          BUDGET_USD: ${{ inputs.budget_usd }}
          LEDGER_ROWS: ${{ inputs.ledger_rows }}
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cp runs/spend_ledger_v2.jsonl shard/shard_ledger.jsonl
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--dry-run"; fi
          if [ -d pilot/shard-1/out ]; then flags="$flags --pilot-from pilot/shard-1/out"; fi
          if [ "$(cat prior/flag)" = "ledger" ]; then
            flags="$flags --prior-ledger prior/run/spend_ledger_v2.jsonl"
          else
            flags="$flags --no-prior-paid-run"
          fi
          # every operator input reaches the driver through env, never through the shell text
          python -m tripwire.live_v2 run --model "$MODEL" --stage "$STAGE" --arm "$ARM" \
            --shard "$SHARD/$SHARDS" --budget-usd "$BUDGET_USD" --ledger-rows "$LEDGER_ROWS" \
            --confirm "$CONFIRM" --spend-ledger shard/shard_ledger.jsonl --out shard/out $flags
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (verify the pin)
        with:
          name: "shard-${{ github.run_id }}-${{ matrix.shard }}"
          path: shard/
          retention-days: 7
          if-no-files-found: warn
  merge:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verify the pin)
        with: { pattern: "shard-${{ github.run_id }}-*", path: dl }
      - name: Merge shard ledgers onto the committed one
        id: kind
        env:
          RUN_ID: ${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p merged
          ledgers=""
          for d in $(ls -d dl/shard-* 2>/dev/null | sort -t- -k3 -n || true); do
            i="${d##*-}"
            mkdir -p "merged/shard-$i"
            cp -r "$d"/. "merged/shard-$i/"
            if [ -f "$d/shard_ledger.jsonl" ]; then ledgers="$ledgers $d/shard_ledger.jsonl"; fi
          done
          code=0
          if [ -n "$ledgers" ]; then
            python -m tripwire.live_v2 merge --base runs/spend_ledger_v2.jsonl \
              --out merged/spend_ledger_v2.jsonl $ledgers || code=$?
          fi
          if [ "$DRY_RUN" = "true" ]; then kind=dry
          elif [ -f merged/spend_ledger_v2.jsonl ] && ! cmp -s runs/spend_ledger_v2.jsonl merged/spend_ledger_v2.jsonl; then kind=paid
          else kind=nospend; fi
          echo "name=live-v2-$kind-$RUN_ID" >> "$GITHUB_OUTPUT"
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (verify the pin)
        with:
          name: ${{ steps.kind.outputs.name }}
          path: merged/
          retention-days: 90
          if-no-files-found: warn
