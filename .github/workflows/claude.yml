# @claude in an issue or PR comment runs Claude Code on GitHub's runners, billed to
# the Max plan through CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
# Only Jott2121 can trigger it. Requires the Claude GitHub app on this repo.
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  claude:
    if: >-
      github.actor == 'Jott2121' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Same pinned setup-python as ci.yml, so Claude can install the package and
      # run the repo's own checks (lint, tests with the coverage floor, blocked-term scan).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode already allows Read/Glob/Grep, file edits inside the workspace
          # (acceptEdits), git add/commit/rm, and pushes only through the action's
          # flag-free `git-push.sh origin <ref>` wrapper. These add what a real build
          # needs. Disallowed rules win over allowed ones.
          claude_args: |
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git branch:*),Bash(git checkout -b claude/*),Bash(git switch claude/*),Bash(git switch -c claude/*),Bash(git fetch origin:*),Bash(git merge origin/*),Bash(git merge --no-ff origin/*),Bash(python -m pytest:*),Bash(pytest:*),Bash(ruff check:*),Bash(ruff format:*),Bash(pip install -e:*),Bash(python -m pip install -e:*),Bash(python scripts/scan_blocked_terms.py:*),Bash(python -m tripwire:*)"
            --disallowedTools "Bash(git push:*),Bash(git reset --hard:*),Bash(git rebase:*),Bash(git tag:*),Bash(git filter-branch:*),Bash(git update-ref:*),Bash(git config:*),Bash(gh secret:*),Bash(gh auth:*),Bash(gh pr merge:*),Bash(gh release:*),Bash(curl:*),Bash(wget:*),Bash(rm -rf:*),Bash(rm -fr:*),Bash(env),Bash(printenv:*),Bash(cat .env*),Read(./.env),Read(./.env.*),Read(**/.env),Read(**/.env.*),Read(~/.ssh/**),Read(~/.config/gh/**),Read(~/.git-credentials)"
