name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python-version: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q --cov=tripwire --cov-report=term-missing --cov-fail-under=90
  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Employer names are never written in the repo. The scan hashes every word and
      # two-word phrase of every tracked file (AGENTS.md, .cursor/, .github/ included)
      # against .github/blocked-terms.sha256 and fails closed if that list is missing,
      # empty, or malformed. EMPLOYER_MARKERS (optional secret) adds patterns.
      - name: Block employer names (hashed list, whole tree)
        env:
          EMPLOYER_MARKERS: ${{ secrets.EMPLOYER_MARKERS }}
        run: python scripts/scan_blocked_terms.py
      # Each check reads its exit code explicitly and fails closed: 0 = found, 1 = clean, anything
      # else = the scan itself failed. A bare `! cmd` line does not stop a bash -e step, so before
      # this only the last such line decided the step and the marker grep could never fail.
      - name: Block export-control markers and committed build junk
        run: |
          rc=0
          git grep -nIiE '\bCUI\b|ITAR|EXPORT CONTROLLED|PROPRIETARY' -- . ':!.cursor' ':!AGENTS.md' ':!.github' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::export-control or proprietary marker in a tracked file (lines above)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::marker scan failed (git grep exit $rc)"; exit 1; fi
          rc=0
          git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::build output is tracked (files above)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::build-junk scan failed (exit $rc)"; exit 1; fi
