[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire"
version = "0.0.1"
description = "Pre-registered tests of whether tool-using AI agents notice wrong engineering data and act on it: planted faults, real FAA records, a fail-closed gate, no LLM judge."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeff Otterson" }]
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "llm-evaluation",
    "tool-use",
    "mcp",
    "data-integrity",
    "fail-closed",
    "preregistration",
    "faa",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Official MCP Python SDK: Streamable HTTP server transport and in-memory client sessions.
    "mcp>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/Jott2121/tripwire"
Repository = "https://github.com/Jott2121/tripwire"
Issues = "https://github.com/Jott2121/tripwire/issues"
"Phase two write-up" = "https://github.com/Jott2121/tripwire/blob/main/docs/results/phase2-real-data.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
tripwire = "tripwire.cli:main"

[tool.setuptools]
packages = ["tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
