[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire"
version = "0.0.1"
description = "Feeds a Grok agent deliberately corrupted engineering data, measures whether it notices, and ships a fail-closed check."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeff Otterson" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
tripwire = "tripwire.cli:main"

[tool.setuptools]
packages = ["tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
