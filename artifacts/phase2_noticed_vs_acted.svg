<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="system-ui,Helvetica,Arial,sans-serif" role="img" aria-label="Phase two on real FAA records: share of mismatches each agent flagged versus share it refused or escalated, by model and condition.">
